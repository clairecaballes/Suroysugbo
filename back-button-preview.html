<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back Button Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #01133b 0%, #001758 25%, #1b45d2 50%, #021036 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 3rem;
            font-size: 2rem;
        }

        .demo-area {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* Back button with modern glassmorphism and gradient theme */
        .back-button {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 50;
            
            /* Modern glassmorphism effect */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            /* Gradient accent border */
            border: 1.5px solid;
            border-image: linear-gradient(135deg, #3b82f6, #1e3a8a) 1;
            
            /* Padding and sizing */
            padding: 0.65rem 1.25rem;
            border-radius: 0.75rem;
            
            /* Typography */
            color: #1e3a8a;
            font-weight: 600;
            font-size: 0.95rem;
            
            /* Layout */
            display: flex;
            align-items: center;
            gap: 0.5rem;
            
            /* Transitions */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Shadow */
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.15);
            
            /* Cursor */
            cursor: pointer;
            font-family: inherit;
        }

        .back-button:hover {
            /* Gradient background on hover */
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(30, 58, 138, 0.1));
            backdrop-filter: blur(12px);
            
            /* Enhanced shadow */
            box-shadow: 0 15px 40px rgba(30, 58, 138, 0.25);
            
            /* Subtle scale */
            transform: translateY(-2px);
        }

        .back-button:active {
            transform: translateY(0);
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.15);
        }

        .back-button svg {
            stroke-width: 2.5;
            flex-shrink: 0;
            width: 1.25rem;
            height: 1.25rem;
        }

        .description {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2rem;
            font-size: 0.95rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .description strong {
            color: white;
        }
    </style>
</head>
<body>
    <button class="back-button">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Back</span>
    </button>

    <div class="container">
        <h1>Back Button Preview</h1>
        <div class="demo-area"></div>
        <div class="description">
            <strong>Features:</strong> Glassmorphism effect with backdrop blur, gradient border matching your theme (blue #3b82f6 to navy #1e3a8a), smooth hover animations with lift effect, and enhanced shadows for depth.
        </div>
    </div>
</body>
</html>
